<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator - Spribe Style</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #000000; color: #ffffff; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        .game-container { width: 100%; max-width: 480px; background: #0e0e0e; border-radius: 12px; overflow: hidden; border: 1px solid #222; }
        
        /* Top Navigation */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #141414; }
        .logo { color: #e50914; font-weight: 900; font-style: italic; font-size: 20px; }
        .back-btn { color: #aaa; text-decoration: none; font-size: 14px; font-weight: bold; }
        .balance-box { background: #000; padding: 5px 12px; border-radius: 20px; border: 1px solid #28a745; color: #28a745; font-weight: bold; font-size: 14px; }

        /* History Ribbon */
        .history-wrapper { background: #0a0a0a; padding: 6px 10px; border-bottom: 1px solid #1a1a1a; display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; }
        .history-wrapper::-webkit-scrollbar { display: none; }
        .badge { padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 11px; background: #1a1a1a; }
        .blue { color: #34b4ff; border: 1px solid rgba(52, 180, 255, 0.3); }
        .purple { color: #913ffb; border: 1px solid rgba(145, 63, 251, 0.3); }

        /* Main Game Stage (Canvas) */
        .stage-container { position: relative; width: 100%; height: 260px; background: radial-gradient(circle, #1a1a2e 0%, #000000 100%); overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
        
        .overlay-multiplier { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); font-size: 45px; font-weight: 800; text-shadow: 0 0 15px rgba(0,0,0,0.8); }
        .mult-blue { color: #ffffff; }
        .mult-purple { color: #c084fc; }
        .mult-crashed { color: #e50914; }

        .flew-away-text { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); color: #e50914; font-size: 14px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }

        /* Betting Controls */
        .controls-panel { padding: 12px; background: #141414; display: flex; flex-direction: column; gap: 10px; }
        .bet-box { background: #1f1f1f; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2a2a2a; }
        .amount-control { display: flex; align-items: center; gap: 8px; }
        .btn-circle { width: 28px; height: 28px; border-radius: 50%; background: #333; color: #fff; border: none; font-weight: bold; cursor: pointer; }
        .bet-input { width: 60px; background: transparent; border: none; color: #fff; text-align: center; font-size: 16px; font-weight: bold; }
        
        .btn-main { width: 120px; height: 45px; border-radius: 8px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: transform 0.1s active; }
        .btn-bet { background: #28a745; color: #fff; box-shadow: 0 4px 10px rgba(40, 167, 69, 0.4); }
        .btn-cashout { background: #ffb400; color: #000; box-shadow: 0 4px 10px rgba(255, 180, 0, 0.4); }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="top-bar">
            <a href="../index.html" class="back-btn">❮ Home</a>
            <div class="logo">Aviator</div>
            <div class="balance-box">৳<span id="bal">0.00</span></div>
        </div>

        <div class="history-wrapper" id="history"></div>

        <div class="stage-container">
            <canvas id="gameCanvas"></canvas>
            <div id="flewText" class="flew-away-text" style="display:none;">FLEW AWAY!</div>
            <div id="multiplier" class="overlay-multiplier mult-blue">1.00x</div>
        </div>

        <div class="controls-panel">
            <div class="bet-box">
                <div class="amount-control">
                    <button class="btn-circle" onclick="adjustBet(-5)">-</button>
                    <input type="number" id="bet-amount" class="bet-input" value="10" readonly>
                    <button class="btn-circle" onclick="adjustBet(5)">+</button>
                </div>
                <button id="main-btn" class="btn-main btn-bet" onclick="handleGameAction()">BET</button>
            </div>
        </div>
    </div>

    <script src="../js/aviator.js"></script>
</body>
</html>
