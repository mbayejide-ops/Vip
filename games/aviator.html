<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Game</title>
    <style>
        body { background: #0e0e0e; color: #fff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 10px; }
        .header { display: flex; justify-content: space-between; padding: 10px; background: #1a1a1a; border-radius: 8px; }
        .history { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; }
        .history-item { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .blue { color: #00bfff; border: 1px solid #00bfff; }
        .purple { color: #a100ff; border: 1px solid #a100ff; }
        
        /* Animation Stage */
        .stage { position: relative; height: 250px; background: #181818; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .plane { position: absolute; bottom: 20px; left: 10px; width: 40px; height: 20px; background: red; border-radius: 50% 50% 0 0; transition: all 0.1s linear; }
        .multiplier { font-size: 40px; font-weight: bold; margin-top: 80px; }
        
        /* Controls */
        .controls { display: flex; gap: 10px; justify-content: center; }
        input { padding: 10px; width: 80px; border-radius: 5px; border: none; text-align: center; }
        button { padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-bet { background: #28a745; color: white; }
        .btn-cashout { background: #ffb400; color: black; }
    </style>
</head>
<body>

    <div class="header">
        <a href="../index.html" style="color:#fff; text-decoration:none;">⬅ হোম</a>
        <div>ব্যালেন্স: ৳<span id="bal">0</span></div>
    </div>

    <!-- Past 15 Rounds History -->
    <div class="history" id="history"></div>

    <!-- Game Screen -->
    <div class="stage">
        <div id="multiplier" class="multiplier blue">1.00x</div>
        <div id="plane" class="plane"></div>
    </div>

    <!-- Betting Controls -->
    <div class="controls">
        <input type="number" id="bet-amount" value="10" min="1">
        <button id="main-btn" class="btn-bet" onclick="handleGameAction()">BET</button>
    </div>

    <script src="../js/aviator.js"></script>
</body>
</html>
