<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Login Section -->
    <div id="login-section" class="auth-container">
        <h2>8KBD Gaming Login</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="ইউজারনেম" required>
            <input type="password" id="password" placeholder="পাসওয়ার্ড" required>
            <button type="submit">লগইন</button>
        </form>
        <p id="error-msg" class="error"></p>
    </div>

    <!-- Main Dashboard / Home Section -->
    <div id="dashboard-section" class="hidden">
        <header class="navbar">
            <div class="logo">8KBD</div>
            <div class="user-info">
                <span id="user-display"></span> | 
                <span class="balance">৳<span id="balance-display">0</span> BDT</span>
            </div>
            <button onclick="logout()" class="logout-btn">লগআউট</button>
        </header>

        <main class="main-content">
            <h3>গরম গেমসমূহ</h3>
            <div class="games-grid" id="games-grid">
                <!-- JavaScript দিয়ে গেমগুলোর কার্ড ডাইনামিকভাবে লোড হবে -->
            </div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
